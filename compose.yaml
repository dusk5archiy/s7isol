name: ${CONFIG_PROJECT_NAME}
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        CONFIG_USERNAME: ${CONFIG_USERNAME}
        CONFIG_WORKSPACE: ${CONFIG_WORKSPACE}
        CONFIG_ENV_XDG_RUNTIME_DIR: ${CONFIG_ENV_XDG_RUNTIME_DIR}
    user: ${CONFIG_USERNAME}
    tty: true
    stdin_open: true
    environment:
      - XDG_RUNTIME_DIR=${CONFIG_ENV_XDG_RUNTIME_DIR}
      - WAYLAND_DISPLAY=${CONFIG_ENV_WAYLAND_DISPLAY}
      - DISPLAY=${CONFIG_ENV_DISPLAY}
    volumes:
      - .:${CONFIG_WORKSPACE}:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${CONFIG_FROM_WAYLAND_SOCKET}:${CONFIG_TO_WAYLAND_SOCKET}
    devices:
      - /dev/dri:/dev/dri
    working_dir: ${CONFIG_WORKSPACE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  dummy_volume:
