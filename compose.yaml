name: ${CONFIG_PROJECT_NAME}
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        CONFIG_USER_NAME: ${CONFIG_USER_NAME}
        CONFIG_WORKSPACE: ${CONFIG_WORKSPACE}
        CONFIG_ENV_XDG_RUNTIME_DIR: ${CONFIG_ENV_XDG_RUNTIME_DIR}
    user: ${CONFIG_USER_NAME}
    tty: true
    stdin_open: true
    environment:
      - XDG_RUNTIME_DIR=${CONFIG_ENV_XDG_RUNTIME_DIR}
      - WAYLAND_DISPLAY=${CONFIG_ENV_WAYLAND_DISPLAY}
      - DISPLAY=${CONFIG_ENV_DISPLAY}
      - ANTHROPIC_BASE_URL=${CONFIG_ENV_ANTHROPIC_BASE_URL}
      - ANTHROPIC_AUTH_TOKEN=${CONFIG_ENV_ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_MODEL=${CONFIG_ENV_ANTHROPIC_MODEL}
    volumes:
      - .:${CONFIG_WORKSPACE}
      - .:/home/${CONFIG_USER_NAME}/s7isol
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${CONFIG_FROM_WAYLAND_SOCKET}:${CONFIG_TO_WAYLAND_SOCKET}
    devices:
      - /dev/dri:/dev/dri
    working_dir: ${CONFIG_WORKSPACE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  dummy_volume:
